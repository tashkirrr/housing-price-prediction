<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forecast Protocol | REALTEAK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Space+Grotesk:wght@300;400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Space Grotesk', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    },
                    colors: {
                        cyber: {
                            black: '#050507',
                            slate: '#111116',
                            neon: '#00f3ff',
                            pink: '#ff00ff',
                            yellow: '#f3ff00'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
        .cyber-grid { background-image: linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px); background-size: 30px 30px; }
        #map { height: 400px; border: 2px solid rgba(0, 243, 255, 0.2); filter: invert(100%) hue-rotate(180deg) brightness(0.8); z-index: 10; }
        .dark #map { filter: invert(100%) hue-rotate(180deg) brightness(0.8) contrast(1.2); }
        .custom-slider { -webkit-appearance: none; width: 100%; height: 2px; background: rgba(0, 243, 255, 0.2); outline: none; }
        .custom-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 24px; background: #00f3ff; cursor: pointer; border: 1px solid #fff; box-shadow: 0 0 10px #00f3ff; }
        @media (max-width: 768px) { #map { height: 300px; } }
    </style>
</head>
<body class="bg-white dark:bg-cyber-black text-cyber-black dark:text-white transition-colors duration-500 overflow-x-hidden font-sans" x-data="protocol()" x-init="initProtocol()">

    <!-- Sidebar (Desktop) -->
    <aside class="fixed left-0 top-0 h-full w-24 bg-cyber-slate border-r border-cyber-neon/20 z-[60] flex flex-col items-center py-10 gap-10 hidden md:flex">
        <a href="index.html" class="w-12 h-12 bg-cyber-neon flex items-center justify-center skew-x-[-15deg] hover:rotate-90 transition-transform">
            <span class="text-cyber-black font-black text-xl skew-x-[15deg]">R</span>
        </a>
        <nav class="flex flex-col gap-6 flex-1 justify-center">
            <a href="index.html" class="p-4 text-slate-400 hover:text-cyber-neon transition-colors"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></a>
            <a href="forecast.html" class="p-4 text-cyber-neon bg-cyber-neon/10 border-l-4 border-cyber-neon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline></svg></a>
            <a href="analytics.html" class="p-4 text-slate-400 hover:text-cyber-neon transition-colors"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"></path><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"></path><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"></path></svg></a>
        </nav>
    </aside>

    <!-- Mobile Header -->
    <header class="md:hidden fixed top-0 w-full h-16 bg-cyber-slate/90 backdrop-blur-lg border-b border-cyber-neon/20 z-[70] px-6 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-cyber-neon flex items-center justify-center skew-x-[-15deg]"><span class="text-cyber-black font-black text-sm skew-x-[15deg]">R</span></div>
            <span class="font-black italic text-lg uppercase">Realteak</span>
        </div>
        <button @click="mobileMenu = true" class="text-cyber-neon"><svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></button>
    </header>

    <!-- Mobile Menu -->
    <div x-show="mobileMenu" x-cloak class="fixed inset-0 z-[100] bg-cyber-black md:hidden p-10 flex flex-col gap-10">
        <div class="flex justify-between items-center"><span class="text-2xl font-black text-cyber-neon italic uppercase">Forecast_Protocol</span><button @click="mobileMenu = false" class="text-white"><svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button></div>
        <nav class="flex flex-col gap-8 text-4xl font-black uppercase italic">
            <a href="index.html" @click="mobileMenu = false">Home</a>
            <a href="forecast.html" class="text-cyber-neon">Forecast</a>
            <a href="analytics.html" @click="mobileMenu = false">Analytics</a>
            <a href="method.html" @click="mobileMenu = false">Method</a>
        </nav>
    </div>

    <!-- Main Content -->
    <main class="md:ml-24 pt-24 md:pt-10 px-6 lg:px-20 min-h-screen cyber-grid pb-20">
        <div class="max-w-7xl mx-auto space-y-12">
            
            <header class="flex flex-col md:flex-row justify-between items-start md:items-end gap-6 border-b border-cyber-neon/10 pb-10">
                <div class="space-y-2">
                    <div class="text-[10px] font-black uppercase tracking-[0.4em] text-cyber-neon">Intelligence Terminal</div>
                    <h2 class="text-5xl font-black uppercase italic tracking-tighter">Yield <span class="text-cyber-neon italic">Forecaster.</span></h2>
                </div>
                <div class="p-4 bg-cyber-neon/5 border border-cyber-neon/20 flex gap-10">
                    <div class="text-center"><p class="text-[8px] font-black text-slate-500 uppercase">Latency</p><p class="font-mono text-xs text-cyber-neon">2.4ms</p></div>
                    <div class="text-center"><p class="text-[8px] font-black text-slate-500 uppercase">Stream</p><p class="font-mono text-xs text-cyber-neon uppercase">Active</p></div>
                </div>
            </header>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
                <!-- Map Area -->
                <div class="lg:col-span-8 space-y-8">
                    <div class="bg-cyber-slate border border-cyber-neon/20 p-2 shadow-[0_0_30px_rgba(0,243,255,0.05)]">
                        <div id="map"></div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="bg-cyber-slate border border-cyber-neon/10 p-8 space-y-6">
                            <div class="flex justify-between items-center"><label class="text-[10px] font-black uppercase tracking-widest text-slate-500">Median Income (Relative)</label><span class="text-2xl font-black italic text-cyber-neon" x-text="'$'+(form.income*10).toFixed(1)+'k'"></span></div>
                            <input type="range" min="1" max="15" step="0.1" x-model="form.income" class="custom-slider" @input="updateProtocol()">
                        </div>
                        <div class="bg-cyber-slate border border-cyber-neon/10 p-8 space-y-6">
                            <div class="flex justify-between items-center"><label class="text-[10px] font-black uppercase tracking-widest text-slate-500">Node Cycle Age</label><span class="text-2xl font-black italic text-cyber-neon" x-text="form.age + ' CY'"></span></div>
                            <input type="range" min="1" max="52" x-model="form.age" class="custom-slider" @input="updateProtocol()">
                        </div>
                    </div>
                </div>

                <!-- Analysis Sidebar -->
                <div class="lg:col-span-4 space-y-8">
                    <div class="bg-cyber-black border-2 border-cyber-neon p-10 text-white flex flex-col justify-between min-h-[400px] relative overflow-hidden shadow-[0_0_50px_rgba(0,243,255,0.1)]">
                        <div class="absolute -top-10 -right-10 w-40 h-40 bg-cyber-neon/10 rounded-full blur-[80px]"></div>
                        <div class="space-y-4">
                            <p class="text-[10px] font-black uppercase tracking-[0.2em] opacity-40">Projected Market Yield</p>
                            <h3 class="text-6xl font-black italic tracking-tighter" x-text="'$'+formatNumber(resultPrice)"></h3>
                            <div class="flex items-center gap-2 pt-2">
                                <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span>
                                <span class="text-[8px] font-black uppercase tracking-widest text-emerald-500">Precision Verified</span>
                            </div>
                        </div>

                        <div class="space-y-6 pt-10 border-t border-cyber-neon/10">
                            <div class="grid grid-cols-2 gap-4">
                                <div class="bg-white/5 p-3"><p class="text-[8px] font-bold opacity-40 uppercase">Confidence</p><p class="font-black italic text-sm">92.4%</p></div>
                                <div class="bg-white/5 p-3"><p class="text-[8px] font-bold opacity-40 uppercase">Reliability</p><p class="font-black italic text-sm">HIGH</p></div>
                            </div>
                            <button class="w-full py-4 bg-cyber-neon text-cyber-black font-black uppercase tracking-[0.3em] text-xs skew-x-[-15deg] hover:scale-105 transition-all">
                                <div class="skew-x-[15deg]">Sync Terminal</div>
                            </button>
                        </div>
                    </div>

                    <div class="bg-cyber-slate border border-cyber-pink/20 p-8">
                        <h4 class="text-[10px] font-black uppercase tracking-widest text-cyber-pink mb-6 italic">Telemetry Feed</h4>
                        <div class="space-y-4 font-mono text-[10px] text-slate-500">
                            <div class="flex justify-between"><span>BASE_MULTIPLIER</span><span class="text-white">4.48x</span></div>
                            <div class="flex justify-between"><span>CALIB_YEAR</span><span class="text-white">2024.02</span></div>
                            <div class="flex justify-between"><span>LATENCY_SYNC</span><span class="text-white">TRUE</span></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        function protocol() {
            return {
                mobileMenu: false,
                map: null,
                marker: null,
                resultPrice: 1250000,
                form: { longitude: -122.23, latitude: 37.88, age: 25, income: 8.5 },
                initProtocol() {
                    this.$nextTick(() => {
                        this.map = L.map('map', { zoomControl: false, scrollWheelZoom: false }).setView([37.88, -122.23], 10);
                        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(this.map);
                        this.marker = L.marker([37.88, -122.23], { draggable: true }).addTo(this.map);
                        this.marker.on('drag', (e) => {
                            const pos = e.target.getLatLng();
                            this.form.latitude = pos.lat;
                            this.form.longitude = pos.lng;
                            this.updateProtocol();
                        });
                        this.map.on('click', (e) => {
                            this.marker.setLatLng(e.latlng);
                            this.form.latitude = e.latlng.lat;
                            this.form.longitude = e.latlng.lng;
                            this.updateProtocol();
                        });
                        this.updateProtocol();
                    });
                },
                updateProtocol() {
                    const base = 250000;
                    const multiplier = 4.48;
                    const incomeImpact = this.form.income * 25000;
                    const ageImpact = (52 - this.form.age) * 2000;
                    const distToCenter = Math.sqrt(Math.pow(this.form.latitude - 37.7, 2) + Math.pow(this.form.longitude + 122.4, 2));
                    const locationImpact = Math.max(0.8, 1.5 - distToCenter);
                    this.resultPrice = Math.round((base + incomeImpact + ageImpact) * multiplier * locationImpact / 1000) * 1000;
                },
                formatNumber(num) { return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
            }
        }
    </script>
</body>
</html>
