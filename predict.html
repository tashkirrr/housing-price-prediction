<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Predictor | Realteak Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #FBFDFF; }
        .glass-card { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
    <!-- Redirection Notice -->
    <div class="fixed top-0 left-0 w-full bg-sky-600 text-white text-[10px] font-bold uppercase tracking-[0.2em] py-2 text-center z-[100]">
        Upgrade Available: Use the <a href="/frontend/index.html" class="underline decoration-sky-300">Modern Dashboard</a> for advanced 2024 insights
    </div>

    <div class="max-w-4xl mx-auto px-6 py-20 lg:py-32">
        <header class="text-center mb-16">
            <h1 class="text-4xl lg:text-5xl font-black text-slate-900 tracking-tight mb-4">Valuation Engine</h1>
            <p class="text-slate-500 font-medium">Configure property features for a high-fidelity prediction.</p>
        </header>

        <div class="glass-card p-8 lg:p-12 rounded-[2.5rem] bg-white shadow-2xl shadow-slate-200/50">
            <form id="predictionForm" class="space-y-10">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="space-y-2">
                        <label class="text-[11px] font-black text-slate-400 uppercase tracking-widest ml-1">Longitude</label>
                        <input type="number" step="any" required placeholder="-122.23" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-6 py-4 focus:ring-4 focus:ring-sky-500/10 focus:border-sky-500 transition-all font-bold">
                    </div>
                    <div class="space-y-2">
                        <label class="text-[11px] font-black text-slate-400 uppercase tracking-widest ml-1">Latitude</label>
                        <input type="number" step="any" required placeholder="37.88" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-6 py-4 focus:ring-4 focus:ring-sky-500/10 focus:border-sky-500 transition-all font-bold">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="space-y-2">
                        <label class="text-[11px] font-black text-slate-400 uppercase tracking-widest ml-1">Median Age</label>
                        <input type="number" required placeholder="41" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-6 py-4 focus:ring-4 focus:ring-sky-500/10 focus:border-sky-500 transition-all font-bold">
                    </div>
                    <div class="space-y-2">
                        <label class="text-[11px] font-black text-slate-400 uppercase tracking-widest ml-1">Ocean Proximity</label>
                        <select class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-6 py-4 focus:ring-4 focus:ring-sky-500/10 focus:border-sky-500 transition-all font-bold appearance-none cursor-pointer">
                            <option>&lt;1H OCEAN</option>
                            <option>INLAND</option>
                            <option>ISLAND</option>
                            <option>NEAR BAY</option>
                            <option>NEAR OCEAN</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                    <div class="space-y-2">
                        <label class="text-[11px] font-black text-slate-400 uppercase tracking-widest ml-1">Rooms</label>
                        <input type="number" required placeholder="880" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-6 py-4 focus:ring-4 focus:ring-sky-500/10 focus:border-sky-500 transition-all font-bold">
                    </div>
                    <div class="space-y-2">
                        <label class="text-[11px] font-black text-slate-400 uppercase tracking-widest ml-1">Bedrooms</label>
                        <input type="number" required placeholder="129" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-6 py-4 focus:ring-4 focus:ring-sky-500/10 focus:border-sky-500 transition-all font-bold">
                    </div>
                    <div class="space-y-2">
                        <label class="text-[11px] font-black text-slate-400 uppercase tracking-widest ml-1">Income ($10k)</label>
                        <input type="number" step="any" required placeholder="8.32" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-6 py-4 focus:ring-4 focus:ring-sky-500/10 focus:border-sky-500 transition-all font-bold">
                    </div>
                </div>

                <button type="submit" class="w-full py-5 bg-sky-600 text-white font-black text-xl rounded-2xl shadow-2xl shadow-sky-200 hover:bg-sky-700 hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center justify-center gap-3">
                    Calculate 2024 Valuation
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
                </button>
            </form>

            <div id="result" class="hidden mt-16 p-10 rounded-[2rem] bg-slate-900 text-white shadow-2xl animate-in slide-in-from-bottom duration-500">
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-6">
                    <div>
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-2">Estimated Value</p>
                        <h2 id="priceDisplay" class="text-5xl font-black text-sky-400">$0</h2>
                    </div>
                    <div class="bg-white/10 p-4 rounded-2xl backdrop-blur-md border border-white/10">
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-1">Confidence</p>
                        <p class="text-2xl font-black text-emerald-400">85.0%</p>
                    </div>
                </div>
            </div>
        </div>
        
        <footer class="mt-16 text-center">
            <a href="/index.html" class="text-sm font-bold text-slate-400 hover:text-sky-600 transition-colors uppercase tracking-widest flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
                Return to Portal
            </a>
        </footer>
    </div>

    <script>
        document.getElementById('predictionForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const resultDiv = document.getElementById('result');
            const priceDisplay = document.getElementById('priceDisplay');
            
            btn.disabled = true;
            btn.innerHTML = '<div class="w-6 h-6 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>';
            
            // Simulation logic for static demo
            setTimeout(() => {
                const estimated = 1250000;
                priceDisplay.textContent = '$' + estimated.toLocaleString();
                resultDiv.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = 'Calculate 2024 Valuation <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>';
            }, 800);
        });
    </script>
</body>
</html>
